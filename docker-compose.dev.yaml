services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.development
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    container_name: perametrics-api-dev
    image: perametrics_api:1.0.0-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - perametrics-network
    depends_on:
      neon-local:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  neon-local:
    image: neondatabase/neon_local:v1.5
    container_name: neon-local
    ports:
      - "5432:5432"
    volumes:
      # Persist branch metadata per git branch (optional)
      - ./.neon_local/:/tmp/.neon_local
      - ./.git/HEAD:/tmp/.git/HEAD:ro,consistent
    env_file:
      - .env.development
    networks:
      - perametrics-network
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', 'localhost', '-p', '5432', '-U', 'neon']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  redis:
    image: redis:8.8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--requirepass 123123 --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - perametrics-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a" ,"123123" ,"ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redisinsight:
    image: redis/redisinsight:3.8
    container_name: redisinsight
    ports:
      -  "5540:5540"
    networks:
      - perametrics-network
    volumes:
      - redisinsight:/data
    depends_on:
      - redis
  
volumes:
  redisinsight:
    driver: local
  redis-data:
    driver: local

networks:
  perametrics-network:
    driver: bridge