services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.development
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    container_name: perametrics-api-dev
    image: perametrics_api:0.0.1
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - perametrics-network
    depends_on:
      - redis
    
  redis:
    image: redis:8.8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--requirepass 123123 --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - perametrics-network

  redisinsight:
    image: redis/redisinsight:3.8
    container_name: redisinsight
    ports:
      -  "5540:5540"
    networks:
      - perametrics-network
    volumes:
      - redisinsight:/data
    depends_on:
      - redis
  
volumes:
  redisinsight:
    driver: local
  redis-data:
    driver: local

networks:
  perametrics-network:
    driver: bridge